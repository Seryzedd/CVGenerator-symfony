<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        AllowOverride All
        Order Allow,Deny
        Allow from All
        
        FallbackResource /index.php
    </Directory>
    
    # Désactiver l'accès aux autres fichiers PHP
    <FilesMatch \.php$>
        SetHandler default-handler
    </FilesMatch>
    
    <Files index.php>
        SetHandler application/x-httpd-php
    </Files>
</VirtualHost>