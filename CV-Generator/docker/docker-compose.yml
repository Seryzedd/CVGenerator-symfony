services:
    web:
        image: php:8.3-apache
        container_name: CV-gen
        build:
            context: ./
        volumes:
            - ./../:/var/www/html
            - ./weasyprint-wrapper:/usr/bin/weasyprint-wrapper
#            - ./apache2.conf:/etc/apache2/apache2.conf
        depends_on:
            - mysql
        links:
            - mysql:mysql
        networks:
            - bridge_network
        ports:
            - "8080:80"
#        command: cd /var/www/html && apt-get update && docker-php-ext-install mysqli pdo pdo_mysql && docker-php-ext-enable pdo_mysql

    mysql:
        image: mariadb:10.2
        container_name: db
        ports:
            - "3306:3306"
        volumes:
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
            - ../mysql_data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=64ra97!
            - MYSQL_DATABASE=CV-Generator
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=fapirmaf
        networks:
            - bridge_network
    
    phpmyadmin:
        image: phpmyadmin
        restart: always
        ports:
            - 8081:80
        environment:
            - PMA_ARBITRARY=1
            - PMA_PORT=3306
            - PMA_HOST=mysql
        networks:
            - bridge_network
        depends_on:
            - mysql

networks:
  bridge_network:
    driver: bridge